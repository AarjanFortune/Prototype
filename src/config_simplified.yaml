# Audio Processing
down_sampling_rate: 22050
bins_per_octave: 24
cqt_n_bins: 192
hop_length: 512

# Data
note_resolution: 16
train_ratio: 0.8
n_cores: 0                   # Force 0 on Windows to bypass system memory thread locks

# Model Architecture
input_feature_type: "cqt"
encoder_type: "conformer"
use_conv_stack: True
d_model: 256                 # Optimized layer size for 6GB RTX 4050 VRAM profiles
encoder_heads: 4
encoder_layers: 3            # Optimized layer depth to complete full execution today

# Training
epoch: 40                    # RAdam + Conformer converges highly effectively within 40 epochs
batch_size: 16               # Optimal throughput size for Tensor Cores
lr: 0.001
weight_decay: 0.0001
gradient_clip_norm: 1.0
use_guided_attention_loss: True

# Output
n_strings: 6
n_frets: 21