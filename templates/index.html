<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guitar Tab Auto-Transcription</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: rgba(21, 24, 32, 0.92);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #edf0f5;
    --muted: #9ca3af;
    --accent: #68d0c7;
    --accent-2: #7c8cff;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top left, rgba(104, 208, 199, 0.16), transparent 28%),
      radial-gradient(circle at bottom right, rgba(124, 140, 255, 0.14), transparent 30%),
      linear-gradient(180deg, #080a0f 0%, #0d1118 55%, #090b10 100%);
  }
  .page {
    width: min(1180px, calc(100% - 32px));
    margin: 0 auto;
    padding: 28px 0 40px;
  }
  .hero {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: clamp(1.8rem, 3vw, 3rem);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.04em;
  }
  p.sub {
    color: var(--muted);
    margin: 8px 0 0;
    max-width: 60ch;
    line-height: 1.5;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 22px;
    margin-top: 20px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(18px);
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  input[type="file"] { color: var(--text); width: 100%; }
  input[type="number"] {
    background: rgba(11, 13, 18, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    width: 100%;
  }
  label { display: block; font-size: 0.95rem; color: #d7dde6; }
  .help { color: var(--muted); font-size: 0.82rem; }
  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 8px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(104, 208, 199, 0.18);
  }
  button:disabled { background: #31363f; cursor: not-allowed; box-shadow: none; }
  #status { margin-top: 16px; font-size: 0.92rem; color: var(--muted); }
  .result-shell {
    margin-top: 18px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  #result img {
    display: block;
    width: 100%;
    min-width: 760px;
    height: auto;
    margin-top: 16px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: #fff;
  }
  .links a {
    display: inline-block;
    margin-right: 14px;
    margin-top: 10px;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .links a:hover { text-decoration: underline; }
  @media (max-width: 820px) {
    .page { width: min(100% - 20px, 100%); padding-top: 18px; }
    .hero { flex-direction: column; align-items: start; }
    .controls { grid-template-columns: 1fr; }
    #result img { min-width: 100%; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <div>
        <h1>Guitar Tab Auto-Transcription</h1>
        <p class="sub">Upload audio and get chunked tab inference with a wrapped score view that stays readable on smaller screens.</p>
      </div>
    </div>

    <div class="card">
      <form id="uploadForm">
        <div class="controls">
          <div class="field">
            <label for="audio">Audio file</label>
            <input type="file" id="audio" name="audio" accept=".wav,.mp3,.flac,.ogg,.m4a" required>
            <div class="help">Supported: .wav, .mp3, .flac, .ogg, .m4a</div>
          </div>

          <div class="field">
            <label for="bpm">BPM</label>
            <input type="number" id="bpm" name="bpm" step="0.1" min="1" placeholder="Auto-detect">
            <div class="help">Leave blank to estimate tempo from the audio.</div>
          </div>
        </div>

        <button type="submit" id="submitBtn">Run transcription</button>
      </form>

      <div id="status"></div>
      <div class="result-shell">
        <div id="result"></div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("uploadForm");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      resultEl.innerHTML = "";
      submitBtn.disabled = true;
      statusEl.textContent = "Uploading and running pipeline (transcription → tab inference → visualization)... this can take a while.";

      const fd = new FormData();
      fd.append("audio", document.getElementById("audio").files[0]);
      const bpmVal = document.getElementById("bpm").value;
      if (bpmVal) fd.append("bpm", bpmVal);

      try {
        const res = await fetch("/transcribe", { method: "POST", body: fd });
        const data = await res.json();

        if (!res.ok) {
          statusEl.textContent = "Error: " + (data.error || "unknown error");
          submitBtn.disabled = false;
          return;
        }

        statusEl.textContent = `Done. BPM used: ${data.bpm_used.toFixed(1)}`;
        resultEl.innerHTML = `
          <img src="${data.image_url}" alt="Tab visualization">
          <div class="links">
            <a href="${data.image_url}" download>Download image</a>
            <a href="${data.midi_url}" download>Download MIDI</a>
            <a href="${data.npz_url}" download>Download predictions (.npz)</a>
          </div>
        `;
      } catch (err) {
        statusEl.textContent = "Request failed: " + err;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
